name: MurtiPreviewApp
options:
  bundleIdPrefix: com.murti.preview
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  Murti:
    path: ../..

targets:
  MurtiPreviewApp:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    dependencies:
      - package: Murti
        product: MurtiCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.murti.preview.MurtiPreviewApp
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
