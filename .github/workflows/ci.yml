name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: swift build & test (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: swift --version
      - run: swift build
      - run: swift test

  ios:
    name: build for iOS (minimum deployment target)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      # The macOS job builds against macOS 14, which allows APIs that iOS 15 lacks.
      # Building for iOS checks the libraries and the gallery against the iOS minimum.
      - run: xcodebuild build -scheme MurtiCore -destination 'generic/platform=iOS Simulator'
      - run: xcodebuild build -scheme MurtiBuilder -destination 'generic/platform=iOS Simulator'
      - run: xcodebuild build -scheme MurtiGallery -destination 'generic/platform=iOS Simulator'

  figma:
    name: figma plugin (typecheck + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: figma-plugin/package-lock.json
      - run: npm ci
        working-directory: figma-plugin
      - run: npm run typecheck
        working-directory: figma-plugin
      - run: npm test
        working-directory: figma-plugin
