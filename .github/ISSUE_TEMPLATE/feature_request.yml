name: Feature request
description: Propose an addition or change.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that Murti makes hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: >
        What would you like to see? Keep Murti's philosophy in mind — a closed action
        vocabulary, no logic in JSON, and "extend by one file / one component."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
